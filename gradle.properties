# Done to increase the memory available to gradle (Loom and NeoForm both set up Minecraft).
org.gradle.jvmargs=-Xmx3G
# Loom needs Java 25+, the system default is Java 21 (GitHub Actions overrides this with its own JDK)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-26.0.2.101-hotspot
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
version=2.0.0
group=cc.avie.pingdisplay
# Fabric allows "-" in mod ids, NeoForge only "_". Assets and translations keep using mod_id.
mod_id=ping-display
neoforge_mod_id=ping_display
mod_name=Ping Display
mod_description=A simple Ping Display with fully configurable colour settings.
mod_author=Avie
mod_license=Avie Terms & Conditions 1.0
java_version=25

minecraft_version=26.3

# Fabric
# check these on https://fabricmc.net/develop
fabric_loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.3

# NeoForge
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.101
neo_form_version=26.3-1
moddev_version=2.0.148

# Dependencies
tabbylib_version=2.0.1
modmenu_version=21.0.0
# Only for the mixin annotations in common
mixin_version=0.17.5+mixin.0.8.7
