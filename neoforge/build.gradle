plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev'
}

neoForge {
	version = neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"${neoforge_mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "cc.avie.tabbylib:tabbylib-neoforge:${tabbylib_version}"
}
